# Builds the site and publishes dist/ as the whole of drpicox.github.io, which
# is what serves david-rodenas.com. The same route the 2024 and 2025 sites took.
#
# Needs one secret in this repository: DEPLOY_TOKEN, a fine-grained personal
# access token with "Contents: read and write" on drpicox/drpicox.github.io.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The open data is a finished year at a time, and the build asks for a year
  # it does not hold. Mid-January, so that a year still gets fetched when
  # nobody happens to push: by then the portals have the whole of December.
  schedule:
    - cron: "10 5 15 1 *"

# Write, because a year fetched by the build is committed back (see below).
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # The build fetched whatever finished year was missing into public/data.
      # Keeping it is what makes the next build ask for nothing; losing it only
      # costs asking again, so a failure here never stops the deploy. A push
      # made with the workflow's own token does not start another workflow.
      - name: Keep the year the build fetched
        continue-on-error: true
        run: |
          git add public/data
          git diff --cached --quiet && echo "No new year." && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Open data: the year that ended, fetched by the build"
          git push

      - name: Check out what is published today
        uses: actions/checkout@v4
        with:
          repository: drpicox/drpicox.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: published

      # Everything in dist/ replaces everything published; CNAME and .nojekyll
      # travel inside dist/ (they live in public/), so nothing has to be kept.
      - name: Replace it with the build
        run: |
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing changed." && exit 0
          git commit -m "Deploy david-rodenas.com from ${GITHUB_SHA::7}"
          git push
